name: Football v2 free control plane

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deterministic Football v2 operation
        required: true
        default: health
        type: choice
        options:
          - health
          - sweep
          - rank
          - xi-self-check
      request_path:
        description: Repository-relative request JSON path (not needed for health/xi-self-check)
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - ".github/workflows/football-control-plane.yml"
      - "models/football/automation/**"
      - "models/football/stages_v4/**"
      - "models/football/engine/core.py"
      - "models/football/engine/adapter.py"
      - "models/football/engine/xi_portable.py"
      - "models/football/CURRENT_MODEL.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/football-control-plane.yml"
      - "models/football/automation/**"
      - "models/football/stages_v4/**"
      - "models/football/engine/core.py"
      - "models/football/engine/adapter.py"
      - "models/football/engine/xi_portable.py"
      - "models/football/CURRENT_MODEL.md"

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve operation
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            op="${{ inputs.operation }}"
            req="${{ inputs.request_path }}"
          else
            op="health"
            req=""
          fi
          echo "operation=$op" >> "$GITHUB_OUTPUT"
          echo "request_path=$req" >> "$GITHUB_OUTPUT"

      - name: Execute deterministic control plane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p football-action-output
          op="${{ steps.resolve.outputs.operation }}"
          req="${{ steps.resolve.outputs.request_path }}"
          if [[ "$op" == "health" || "$op" == "xi-self-check" ]]; then
            python models/football/automation/control_plane.py               --operation "$op"               --output-dir football-action-output
          else
            test -n "$req" || { echo "request_path is required for $op" >&2; exit 2; }
            test -f "$req" || { echo "request_path not found: $req" >&2; exit 2; }
            python models/football/automation/control_plane.py               --operation "$op"               --request "$req"               --output-dir football-action-output
          fi

      - name: Show compact result
        if: always()
        shell: bash
        run: |
          if [[ -f football-action-output/summary.json ]]; then
            cat football-action-output/summary.json
          fi

      - name: Upload control-plane result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-control-${{ github.run_id }}
          path: football-action-output/
          retention-days: 7
          if-no-files-found: warn
