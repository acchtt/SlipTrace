name: Football active deterministic engine tests

on:
  push:
    paths:
      - "models/football/engine/**"
      - "models/football/airtable/ACTIVE_MODEL_ROUTING.json"
      - ".github/workflows/football-engine-tests.yml"
  pull_request:
    paths:
      - "models/football/engine/**"
      - "models/football/airtable/ACTIVE_MODEL_ROUTING.json"
      - ".github/workflows/football-engine-tests.yml"

permissions:
  contents: read

jobs:
  active-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run active Football C deterministic tests
        env:
          PYTHONPATH: models/football/engine
        run: |
          set -euo pipefail
          for test in             test_core.py             test_active_c_runtime.py             test_competition_reliability.py             test_model_airtable_routing.py             test_model_bet_accounting.py             test_simple_assess_bet_default.py             test_step2_publication_guard.py             test_step2_queue_guard.py             test_sweep_rank_retirement.py             test_xi_user_screenshot_only.py
          do
            python -m unittest discover -s models/football/engine/tests -p "$test" -v
          done
