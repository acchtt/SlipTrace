jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check Football C production invariants
        run: python models/football/qa/check_post_xi_research_gate.py
      - name: Check Football C authority semantics
        run: python models/football/qa/check_authority_consistency.py
      - name: Check Football runtime execution contract
        run: python models/football/qa/check_runtime_execution_contract.py
      - name: Check XI portable runtime freshness
        run: python models/football/qa/check_xi_portable_runtime.py
      - name: Self-check XI portable runtime
        run: python models/football/engine/xi_portable.py self-check
