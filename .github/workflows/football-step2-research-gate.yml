name: Football C production invariants

on:
  push:
    paths:
      - "models/football/CURRENT_MODEL.md"
      - "models/football/production/FOOTBALL_C.md"
      - "models/football/procedures/FOOTBALL_TOURNAMENT_INCENTIVE_INTEGRITY.md"
      - "models/football/challengers/football-c2/**"
      - "models/football/engine/adapter.py"
      - "models/football/engine/schema.json"
      - "models/football/prompts/01_WORK_DAILY_SWEEP.md"
      - "models/football/prompts/02_NORMAL_CHAT_XI_ODDS.md"
      - "models/football/prompts/03_NORMAL_CHAT_LIVE.md"
      - "models/football/prompts/04_WORK_POST_SLATE_AUDIT.md"
      - "models/football/qa/check_post_xi_research_gate.py"
      - ".github/workflows/football-step2-research-gate.yml"
  pull_request:
    paths:
      - "models/football/CURRENT_MODEL.md"
      - "models/football/production/FOOTBALL_C.md"
      - "models/football/procedures/FOOTBALL_TOURNAMENT_INCENTIVE_INTEGRITY.md"
      - "models/football/challengers/football-c2/**"
      - "models/football/engine/adapter.py"
      - "models/football/engine/schema.json"
      - "models/football/prompts/01_WORK_DAILY_SWEEP.md"
      - "models/football/prompts/02_NORMAL_CHAT_XI_ODDS.md"
      - "models/football/prompts/03_NORMAL_CHAT_LIVE.md"
      - "models/football/prompts/04_WORK_POST_SLATE_AUDIT.md"
      - "models/football/qa/check_post_xi_research_gate.py"
      - ".github/workflows/football-step2-research-gate.yml"

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check Football C production invariants
        run: python models/football/qa/check_post_xi_research_gate.py
