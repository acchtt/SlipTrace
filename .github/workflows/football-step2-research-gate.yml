name: Football C production invariants

on:
  push:
    paths:
      - "models/football/CURRENT_MODEL.md"
      - "models/football/stages_v4/**"
      - "models/football/engine/core.py"
      - "models/football/engine/adapter.py"
      - "models/football/engine/xi_portable.py"
      - "models/football/engine/step2_queue_guard.py"
      - "models/football/engine/xi_assessment_reconcile.py"
      - "models/football/engine/step2_publication_guard.py"
      - "models/football/engine/model_bet_accounting.py"
      - "models/football/engine/tests/**"
      - "models/football/google_sheets/ACTIVE_STORE_ROUTING.json"
      - "models/football/google_sheets/ACTIVE_STORE_ROUTING.md"
      - "models/football/procedures/FOOTBALL_SIMPLE_ASSESS_AND_BET.md"
      - "models/football/procedures/FOOTBALL_MODEL_BET_ACCOUNTING.md"
      - "models/football/prompts/02_NORMAL_CHAT_XI_ODDS.md"
      - "models/football/prompts/03_NORMAL_CHAT_LIVE.md"
      - "models/football/prompts/COMMAND_ALIASES.md"
      - "models/football/qa/check_post_xi_research_gate.py"
      - "models/football/qa/check_authority_consistency.py"
      - "models/football/qa/check_runtime_execution_contract.py"
      - "models/football/qa/check_xi_portable_runtime.py"
      - "models/football/qa/check_xi_portable_execution.py"
      - ".github/workflows/football-step2-research-gate.yml"
  pull_request:
    paths:
      - "models/football/CURRENT_MODEL.md"
      - "models/football/stages_v4/**"
      - "models/football/engine/**"
      - "models/football/google_sheets/ACTIVE_STORE_ROUTING.json"
      - "models/football/google_sheets/ACTIVE_STORE_ROUTING.md"
      - "models/football/procedures/FOOTBALL_SIMPLE_ASSESS_AND_BET.md"
      - "models/football/procedures/FOOTBALL_MODEL_BET_ACCOUNTING.md"
      - "models/football/prompts/02_NORMAL_CHAT_XI_ODDS.md"
      - "models/football/prompts/03_NORMAL_CHAT_LIVE.md"
      - "models/football/prompts/COMMAND_ALIASES.md"
      - "models/football/qa/check_post_xi_research_gate.py"
      - "models/football/qa/check_authority_consistency.py"
      - "models/football/qa/check_runtime_execution_contract.py"
      - "models/football/qa/check_xi_portable_runtime.py"
      - "models/football/qa/check_xi_portable_execution.py"
      - ".github/workflows/football-step2-research-gate.yml"

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check active Football C production invariants
        run: python models/football/qa/check_post_xi_research_gate.py
      - name: Check single-model authority and overlap
        run: python models/football/qa/check_authority_consistency.py
      - name: Check direct runtime contract
        run: python models/football/qa/check_runtime_execution_contract.py
      - name: Check thin XI runtime
        run: python models/football/qa/check_xi_portable_runtime.py
      - name: Smoke-test single-C XI execution
        run: python models/football/qa/check_xi_portable_execution.py
