name: Pending goal research 2026-10-14
on:
  push:
    paths:
      - "models/football/stages_v4/research_pending_20261014.py"
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Research frozen pending cohort
        run: python models/football/stages_v4/research_pending_20261014.py
      - uses: actions/upload-artifact@v4
        with:
          name: pending-goal-research-20261014
          path: models/football/stages_v4/recovery/V4-20261014-1725-20261015-0000/pending-goal-research-assessment.json
          retention-days: 7
