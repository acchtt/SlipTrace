name: Football V4 Work non-browser acquisition
on:
  push:
    paths:
      - "models/football/stages_v4/acquisition_requests/**"
      - "models/football/stages_v4/tools/work_source_acquisition.py"
      - ".github/workflows/football-v4-work-acquisition.yml"
  pull_request:
    paths:
      - "models/football/stages_v4/acquisition_requests/**"
      - "models/football/stages_v4/tools/work_source_acquisition.py"
      - ".github/workflows/football-v4-work-acquisition.yml"
      - "models/football/stages_v4/test_work_source_acquisition.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit-test acquisition request and provenance logic
        run: python -m unittest discover -s models/football/stages_v4 -p test_work_source_acquisition.py
      - name: Fetch source date JSON without a browser
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p acquisition-artifacts
          shopt -s nullglob
          requests=(models/football/stages_v4/acquisition_requests/V4-*.json)
          if (( ${#requests[@]} == 0 )); then
            echo 'No requests committed. Add a V4-*.json request to acquisition_requests/.' > acquisition-artifacts/README.txt
            exit 0
          fi
          for request in "${requests[@]}"; do
            name="$(basename "$request" .json)"
            python models/football/stages_v4/tools/work_source_acquisition.py \
              --request "$request" --output "acquisition-artifacts/$name" || true
          done
          # Artifacts are evidence/checkpoints only, never native V4 receipts.
      - name: Upload evidence and explicit blocked states
        uses: actions/upload-artifact@v4
        with:
          name: v4-work-raw-acquisition-evidence
          path: acquisition-artifacts/
          retention-days: 7
          if-no-files-found: error
      - name: Fail closed when source acquisition is blocked
        run: |
          if test -f acquisition-artifacts/failed-requests.txt; then
            cat acquisition-artifacts/failed-requests.txt
            echo "Raw provider acquisition failed; artifact contains exact errors."
            exit 1
          fi
