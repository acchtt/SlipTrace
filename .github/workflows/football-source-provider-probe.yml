name: Football source provider probe

on:
  push:
    branches: [main]
    paths:
      - "models/football/stages_v4/tools/source_provider_probe.py"
      - ".github/workflows/football-source-provider-probe.yml"
  pull_request:
    paths:
      - "models/football/stages_v4/tools/source_provider_probe.py"
      - ".github/workflows/football-source-provider-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Probe source carriers
        run: |
          today="$(date -u +%F)"
          tomorrow="$(date -u -d '+1 day' +%F)"
          python models/football/stages_v4/tools/source_provider_probe.py "$today"
          python models/football/stages_v4/tools/source_provider_probe.py "$tomorrow"
          # Fixed regression date: validates UTC handling against the 20 Oct
          # Champions League block that FootballInfo shifted by +1 hour.
          python models/football/stages_v4/tools/source_provider_probe.py "2026-10-20"
