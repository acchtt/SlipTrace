name: Football DeepEval QA

on:
  push:
    paths:
      - "models/football/qa/deepeval/**"
      - ".github/workflows/football-deepeval.yml"
  pull_request:
    paths:
      - "models/football/qa/deepeval/**"
      - ".github/workflows/football-deepeval.yml"

permissions:
  contents: read

jobs:
  deterministic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: models/football/qa/deepeval/requirements.txt

      - name: Install DeepEval QA dependencies
        run: python -m pip install -r models/football/qa/deepeval/requirements.txt

      - name: Run deterministic football contracts
        run: deepeval test run models/football/qa/deepeval/tests

      - name: Print historical QA signal summary
        run: |
          python models/football/qa/deepeval/historical_audit.py --summary --fail-on-blocking
