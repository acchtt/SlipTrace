name: Football V4 original-source replay attestation
on:
  push:
    paths:
      - ".github/workflows/football-v4-replay-attestation.yml"
      - "models/football/stages_v4/replay_unattested.py"
      - "models/football/stages_v4/stage.py"
      - "models/football/stages_v4/source_completeness.py"
      - "models/football/stages_v4/recovery/**"
  pull_request:
    paths:
      - ".github/workflows/football-v4-replay-attestation.yml"
      - "models/football/stages_v4/replay_unattested.py"
      - "models/football/stages_v4/stage.py"
      - "models/football/stages_v4/source_completeness.py"
      - "models/football/stages_v4/recovery/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v4-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rerun actual V4 stage using original unchanged source
        run: |
          set -euo pipefail
          mkdir -p v4-attested-artifacts
          for source in models/football/stages_v4/recovery/V4-*/source.json; do
            test -f "$source" || continue
            folder="${source%/source.json}"
            run="${folder##*/}"
            cp "$folder/source.json" "v4-attested-artifacts/${run}-source.json"

            # Recovery sources that do not carry the current independent
            # priority-completeness proof are immutable audit evidence. They
            # must not be re-minted under today's production contract.
            if ! test -f "$folder/intake-unattested.json" && ! python - "$folder/source.json" <<'PY'
          import json,sys
          from pathlib import Path
          source=json.loads(Path(sys.argv[1]).read_text())
          priority=(source.get("priority_completeness_verification") or {}).get("status")
          if priority != "PRIORITY_COMPLETENESS_VERIFIED":
              raise SystemExit(1)
          PY
            then
              python - "$folder/source.json" "$run" <<'PY'
          import json,sys
          from pathlib import Path
          source=json.loads(Path(sys.argv[1]).read_text())
          run=sys.argv[2]
          proof={
            "schema_version":"football-v4-replay-blocked-v1",
            "status":"HISTORICAL_SOURCE_NOT_CURRENTLY_ATTESTABLE",
            "run_id":run,
            "reason":"HISTORICAL_SOURCE_LACKS_CURRENT_PRIORITY_COMPLETENESS_PROOF",
            "production_rank_authorized":False,
            "source_run_id":source.get("run_id"),
          }
          Path(f"v4-attested-artifacts/{run}-replay_blocked.json").write_text(
              json.dumps(proof,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
              continue
            fi

            if test -f "$folder/repair-manifest.json"; then
              # A fixture-status repair is a sealed derivative of an already
              # researched source snapshot. Verify its chain of custody and
              # receipt integrity; do not pretend the amended historical
              # source is a fresh provider fetch.
              python - "$folder/source.json" "$folder/v4_sweep_ready.json" "$folder/repair-manifest.json" "$folder/rank-handoff.json" "$run" <<'PY'
          import hashlib,json,sys
          from pathlib import Path

          source_path=Path(sys.argv[1])
          receipt_path=Path(sys.argv[2])
          repair_path=Path(sys.argv[3])
          handoff_path=Path(sys.argv[4])
          run=sys.argv[5]

          source_bytes=source_path.read_bytes()
          source=json.loads(source_bytes)
          receipt=json.loads(receipt_path.read_text())
          repair=json.loads(repair_path.read_text())
          handoff=json.loads(handoff_path.read_text())

          def digest_payload(obj):
              body={k:v for k,v in obj.items() if k!="integrity_sha256"}
              raw=json.dumps(body,sort_keys=True,ensure_ascii=True,separators=(",",":")).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          source_sha=hashlib.sha256(source_bytes).hexdigest()
          assert source.get("run_id")==run
          assert receipt.get("run_id")==run
          assert handoff.get("run_id")==run
          assert repair.get("status")=="SWEEP_RECEIPT_REPAIR_VERIFIED"
          assert repair.get("replay_verified") is True
          assert repair.get("preserved_source_rows_unchanged") is True
          assert repair.get("preserved_researched_facts_unchanged") is True
          assert repair.get("new_acquisition_performed") is False
          assert repair.get("source_sha256")==source_sha
          assert receipt.get("integrity_sha256")==digest_payload(receipt)
          assert repair.get("receipt_integrity_sha256")==receipt.get("integrity_sha256")
          assert handoff.get("source_file_sha256")==source_sha
          assert handoff.get("receipt_integrity_sha256")==receipt.get("integrity_sha256")
          assert (handoff.get("receipt_repair") or {}).get("excluded_match_id")==repair.get("excluded_match_id")

          out=Path("v4-attested-artifacts")
          (out/f"{run}-v4_sweep_ready.json").write_bytes(receipt_path.read_bytes())
          (out/f"{run}-rank-handoff.json").write_bytes(handoff_path.read_bytes())
          (out/f"{run}-repair-manifest.json").write_bytes(repair_path.read_bytes())
          print("Verified sealed fixture-status repair:",run,receipt["integrity_sha256"])
          PY
              continue
            fi

            if test -f "$folder/intake-unattested.json"; then
              # Historic cross-chat repair: replay the exact saved snapshot;
              # do not treat the derived hash as a production certificate.
              python models/football/stages_v4/replay_unattested.py \
                --source "$folder/source.json" \
                --derived "$folder/intake-unattested.json" \
                --output "v4-attested-artifacts/${run}-v4_sweep_ready.json" \
                --report "v4-attested-artifacts/${run}-replay_proof.json"
            else
              # Archived recovery sources are immutable evidence, not live feeds.
              # Re-execute at the source's own frozen observation epoch so an
              # old artifact does not fail merely because the CI runner clock
              # advanced. Rank still requires a fresh full-cohort status check.
              frozen_now="$(python - "$folder/source.json" <<'PY'
          import json,sys
          from datetime import datetime
          from pathlib import Path
          source=json.loads(Path(sys.argv[1]).read_text())
          stamps=[]
          def walk(value):
              if isinstance(value,dict):
                  for key,item in value.items():
                      if key.endswith(("observed_at_utc","checked_at_utc")) and isinstance(item,str):
                          stamps.append(datetime.fromisoformat(item.replace("Z","+00:00")))
                      else:
                          walk(item)
              elif isinstance(value,list):
                  for item in value:
                      walk(item)
          walk(source)
          if not stamps:
              raise SystemExit("archived V4 source has no observation timestamp")
          print(max(stamps).isoformat())
          PY
              )"
              python models/football/stages_v4/stage.py \
                --now "$frozen_now" \
                --output "v4-attested-artifacts/${run}-v4_sweep_ready.json" \
                sweep --source "$folder/source.json"
              python - "$folder/source.json" "$run" <<'PY'
          import json,sys
          from pathlib import Path
          source=json.loads(Path(sys.argv[1]).read_text())
          output=Path("v4-attested-artifacts")/(sys.argv[2]+"-v4_sweep_ready.json")
          done=json.loads(output.read_text())
          assert done["status"]=="V4_SWEEP_READY" and done["run_id"]==source["run_id"]
          print("V4 native stage receipt verified:",done["integrity_sha256"])
          PY
            fi
            python - "$folder/source.json" "v4-attested-artifacts/${run}-v4_sweep_ready.json" "$run" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          source_path=Path(sys.argv[1])
          receipt_path=Path(sys.argv[2])
          run=sys.argv[3]
          source_bytes=source_path.read_bytes()
          source=json.loads(source_bytes)
          receipt=json.loads(receipt_path.read_text())
          manifest={
            "schema_version":"football-v4-rank-handoff-v1",
            "status":"V4_RANK_HANDOFF_READY",
            "run_id":run,
            "source_filename":f"{run}-source.json",
            "source_file_sha256":hashlib.sha256(source_bytes).hexdigest(),
            "receipt_filename":f"{run}-v4_sweep_ready.json",
            "receipt_integrity_sha256":receipt["integrity_sha256"],
            "source_run_id":source["run_id"],
            "requires_fresh_status_refresh":True,
            "rank_must_not_reconstruct_source_from_airtable":True,
          }
          assert manifest["source_run_id"]==run
          Path(f"v4-attested-artifacts/{run}-rank-handoff.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
          done
          test -n "$(find v4-attested-artifacts -type f -name '*v4_sweep_ready.json' -print -quit)"
          test -n "$(find v4-attested-artifacts -type f -name '*-source.json' -print -quit)"
          test -n "$(find v4-attested-artifacts -type f -name '*-rank-handoff.json' -print -quit)"
      - name: Emit valid snapshot as cross-chat bundle (receipt + source + manifest; no Airtable write)
        uses: actions/upload-artifact@v4
        with:
          name: v4-original-source-attested-receipts
          path: v4-attested-artifacts/
          retention-days: 7
          if-no-files-found: error
