name: Touchline Windows
on:
  push:
    branches: [main, 'codex/touchline-windows']
    paths: ['windows/**', '.github/workflows/touchline-windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/touchline-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test score and notification transitions
        run: dotnet run --project windows/Touchline.Tests -c Release
      - name: Publish portable Windows x64 app
        run: dotnet publish windows/Touchline -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/Touchline
      - name: Include instructions
        run: Copy-Item windows/README.md dist/Touchline/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: Touchline-Windows-x64
          path: dist/Touchline/
          retention-days: 30
