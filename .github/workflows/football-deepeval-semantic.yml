name: Football DeepEval Semantic QA

on:
  workflow_dispatch:
    inputs:
      max_cases:
        description: "Maximum historical cases for the LLM judge"
        required: false
        default: "12"

permissions:
  contents: read

jobs:
  semantic-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: models/football/qa/deepeval/requirements.txt

      - name: Install DeepEval QA dependencies
        run: python -m pip install -r models/football/qa/deepeval/requirements.txt

      - name: Verify semantic judge credential
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY repository secret is not configured. Deterministic DeepEval CI is still available without it."
            exit 1
          fi

      - name: Run historical semantic judge
        run: |
          python models/football/qa/deepeval/run_semantic.py --limit "${{ inputs.max_cases }}"
