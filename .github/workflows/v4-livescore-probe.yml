name: V4 LiveScore endpoint probe
on:
  push:
    paths:
      - ".github/workflows/v4-livescore-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe current date API variants
        run: |
          python - <<'PY'
          import json, urllib.request
          headers={"User-Agent":"Mozilla/5.0","Origin":"https://www.livescore.com","Referer":"https://www.livescore.com/"}
          for day,off in [("20261013",7),("20261014",7),("20261013",0)]:
            urls=[
              f"https://prod-public-api.livescore.com/v1/api/react/date/soccer/{day}/{off}.00?MD=1&countryCode=US&locale=en",
              f"https://prod-public-api.livescore.com/v1/api/react/date/soccer/{day}/{off}.00?MD=1",
              f"https://prod-public-api.livescore.com/v1/api/app/date/soccer/{day}/{off}?MD=1&countryCode=US&locale=en",
              f"https://prod-public-api.livescore.com/v1/api/app/date/soccer/{day}/{off}?MD=1&locale=en",
            ]
            for u in urls:
              try:
                req=urllib.request.Request(u,headers=headers)
                with urllib.request.urlopen(req,timeout=15) as r:
                  d=json.loads(r.read())
                stages=d.get("Stages",[])
                events=sum(len(s.get("Events",[])) for s in stages if isinstance(s,dict))
                print(json.dumps({"day":day,"off":off,"url":u,"stages":len(stages),"events":events,"keys":list(d)[:20]}))
              except Exception as e:
                print(json.dumps({"day":day,"off":off,"url":u,"error":repr(e)}))
          PY
